display_information:
  name: Garden RCA Bot
  description: Trigger RCA investigations and codebase Q&A for Garden Finance
  background_color: "#1a1a2e"

features:
  bot_user:
    display_name: Garden RCA Bot
    always_online: false
  slash_commands:
    - command: /investigate
      description: Run RCA on a Garden order ID
      usage_hint: "<order_id> [--investigate]"
      should_escape: false
    - command: /explore
      description: Ask a question about the Garden codebase
      usage_hint: "<question>"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - commands
      - chat:write

settings:
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
